<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho — KUMANI</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-page="carrinho">

  <a href="#main-content" class="skip-link">Saltar para o conteúdo principal</a>

  <div data-partial="header"></div>

  <main id="main-content" class="u-header-offset">
    <div class="cart-page" data-cart-page>
      <h1 class="cart-page__title">O seu carrinho</h1>

      <div data-cart-empty class="cart-empty" style="display:none;">
        <p>O seu carrinho está vazio.</p>
        <a href="/loja.html" class="btn btn--primary" style="margin-top:16px;">Ver Loja</a>
      </div>

      <div data-cart-list></div>

      <div data-cart-summary class="cart-summary" style="display:none;">
        <div class="cart-summary__row">
          <span>Total</span>
          <span data-cart-total></span>
        </div>
        <a href="/checkout.html" class="btn btn--primary btn--full">Avançar para checkout</a>
      </div>
    </div>
  </main>

  <div data-partial="footer"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
