  <meta property="og:site_name" content="KUMANI">

  <meta property="og:description" content="A KUMANI é uma agência de publicidade moçambicana: publicidade, marketing digital, design gráfico, imagem corporativa, sinalização, impressão, gráfica e móveis.">
  <meta property="og:url" content="https://www.grupokumani.com/">

<body data-page="checkout">

  <a href="#main-content" class="skip-link">Saltar para o conteúdo principal</a>

  <div data-partial="header"></div>

  <main id="main-content" class="u-header-offset">
    <div class="checkout-page">
      <h1 class="checkout-page__title">Checkout</h1>

      <div class="checkout-grid">
        <form data-checkout-form novalidate>
          <div class="field">
            <label class="field__label" for="c-nome">Nome<span class="field__required">*</span></label>
            <input class="field__input" id="c-nome" name="nome" type="text" required>
          </div>
          <div class="field">
            <label class="field__label" for="c-telefone">Telefone (M-Pesa/e-Mola)<span class="field__required">*</span></label>
            <input class="field__input" id="c-telefone" name="telefone" type="tel" required>
          </div>
          <div class="field">
            <label class="field__label" for="c-email">Email</label>
            <input class="field__input" id="c-email" name="email" type="email">
          </div>
          <div class="field">
            <label class="field__label" for="c-morada">Morada de entrega<span class="field__required">*</span></label>
            <textarea class="field__textarea" id="c-morada" name="morada" required></textarea>
          </div>

          <div class="form-message form-message--error" data-checkout-error style="display:none;"></div>

          <button type="submit" class="btn btn--primary btn--full" data-checkout-submit>
            Pagar com M-Pesa / e-Mola
          </button>
        </form>

        <aside class="checkout-summary">
          <div data-checkout-items></div>
          <div class="checkout-summary__total">
            <span>Total</span>
            <span data-checkout-total></span>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <div data-partial="footer"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
