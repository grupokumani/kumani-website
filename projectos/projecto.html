<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Study — KUMANI</title>
  <meta name="description" content="Case study de um projecto real da KUMANI.">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-page="case-study">

  <a href="#main-content" class="skip-link">Saltar para o conteúdo principal</a>

  <div data-partial="header"></div>

  <main id="main-content" data-case-study>

    <section class="case-hero">
      <div class="case-hero__media" data-case-hero-media></div>
      <div class="case-hero__overlay"></div>
      <div class="case-hero__content">
        <p class="case-hero__category" data-case-category></p>
        <h1 class="case-hero__client" data-case-client></h1>
      </div>
    </section>

    <article class="case-body">
      <div class="case-block">
        <p class="case-block__label">Problema</p>
        <p class="case-block__text" data-case-problema></p>
      </div>
      <div class="case-block">
        <p class="case-block__label">Objectivo</p>
        <p class="case-block__text" data-case-objectivo></p>
      </div>
      <div class="case-block">
        <p class="case-block__label">Estratégia</p>
        <p class="case-block__text" data-case-estrategia></p>
      </div>
      <div class="case-block">
        <p class="case-block__label">Execução</p>
        <p class="case-block__text" data-case-execucao></p>
      </div>
      <div class="case-block">
        <p class="case-block__label">Resultado</p>
        <p class="case-block__text" data-case-resultado></p>
      </div>
    </article>

    <div class="case-gallery" data-case-gallery>
      <!-- Preenchido por js/modules/case-study.js -->
    </div>

    <section class="case-cta">
      <h2 class="case-cta__title">Gostou deste trabalho?</h2>
      <div class="case-cta__actions">
        <a href="/contacto.html" class="btn btn--primary">Pedir orçamento para projecto semelhante</a>
        <a href="/portfolio.html" class="btn btn--secondary">Ver outro projecto</a>
      </div>
    </section>

  </main>

  <div data-partial="footer"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
