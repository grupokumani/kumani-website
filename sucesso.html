  <script>
// Confetti nativo — sem biblioteca externa
(function() {
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const cores = ['#2d7a06','#ffffff','#1b1b1b','#39a108','#ffd700','#4caf50'];
  const particulas = Array.from({ length: 140 }, () => ({
    x: Math.random() * canvas.width,
    y: -10 - Math.random() * 200,
    w: 6 + Math.random() * 8,
    h: 10 + Math.random() * 6,
    cor: cores[Math.floor(Math.random() * cores.length)],
    vel: 2.5 + Math.random() * 4,
    angular: (Math.random() - 0.5) * 0.15,
    angulo: Math.random() * Math.PI * 2,
    vaiv: (Math.random() - 0.5) * 2,
  }));

  let ativo = true;

  function animar() {
    if (!ativo) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let vivos = false;

    particulas.forEach((p) => {
      p.y += p.vel;
      p.x += p.vaiv;
      p.angulo += p.angular;

      ctx.save();
      ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
      ctx.rotate(p.angulo);
      ctx.fillStyle = p.cor;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();

      if (p.y < canvas.height + 20) vivos = true;
    });

    if (vivos) {
      requestAnimationFrame(animar);
    } else {
      ativo = false;
      canvas.remove();
    }
  }

  // Começa 300ms após carregar para ser visível
  setTimeout(animar, 300);

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
})();
</script>
