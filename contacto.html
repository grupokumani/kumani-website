<body data-page="contacto">

  <a href="#main-content" class="skip-link">Saltar para o conteúdo principal</a>

<div data-partial="header"></div>
<button type="button" data-back-button aria-label="Voltar à página anterior">Voltar</button>

    <main id="main-content" class="u-header-offset">
    <section style="padding:64px 24px 24px;max-width:760px;">
      <h1 style="font-size:36px;font-weight:700;text-transform:uppercase;">Vamos conversar.</h1>
    </section>

    <section style="padding:0 24px 64px;max-width:760px;">
      <form data-contact-form novalidate>

        <div data-contact-context style="display:none;background:var(--color-bg-subtle);border-left:3px solid var(--kumani-green);padding:12px 16px;margin-bottom:24px;font-size:14px;"></div>

        <div class="form-row">
          <div class="field">
            <label class="field__label" for="ct-nome">Nome<span class="field__required">*</span></label>
            <input class="field__input" id="ct-nome" name="nome" type="text" required>
          </div>
          <div class="field">
            <label class="field__label" for="ct-empresa">Empresa</label>
            <input class="field__input" id="ct-empresa" name="empresa" type="text">
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label class="field__label" for="ct-email">Email<span class="field__required">*</span></label>
            <input class="field__input" id="ct-email" name="email" type="email" required>
          </div>
          <div class="field">
            <label class="field__label" for="ct-telefone">Telefone<span class="field__required">*</span></label>
            <input class="field__input" id="ct-telefone" name="telefone" type="tel" required>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label class="field__label" for="ct-area">Área de actuação</label>
            <input class="field__input" id="ct-area" name="areaActuacao" type="text" placeholder="Ex: Restauração, Retalho, Saúde...">
          </div>
          <div class="field">
            <label class="field__label" for="ct-orcamento">Orçamento disponível</label>
            <select class="field__input" id="ct-orcamento" name="orcamento">
              <option value="">Prefiro não dizer</option>
              <option value="Até 10.000 MZN">Até 10.000 MZN</option>
              <option value="10.000 – 50.000 MZN">10.000 – 50.000 MZN</option>
              <option value="50.000 – 150.000 MZN">50.000 – 150.000 MZN</option>
              <option value="Mais de 150.000 MZN">Mais de 150.000 MZN</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="ct-mensagem">Mensagem<span class="field__required">*</span></label>
          <textarea class="field__textarea" id="ct-mensagem" name="mensagem" required></textarea>
        </div>

        <div class="field field--checkbox">
          <input type="checkbox" id="ct-consentimento" name="consentimento" required>
          <label class="field__label" for="ct-consentimento">Autorizo a KUMANI a usar os meus dados para me contactar.</label>
        </div>

        <button type="submit" class="btn btn--primary btn--full" data-contact-submit>Enviar mensagem</button>
        <div data-contact-message></div>
      </form>
    </section>
  </main>

  <div data-partial="footer"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
